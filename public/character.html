<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
    <meta name="theme-color" content="#110E18"><title>MacroTracker</title><script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/avatar.css">
</head>
<body class="auth-page character-page" data-auth-loading>
    <div id="toast-container" role="status" aria-live="polite"></div>
    <div id="float-tip" class="chart-tip is-floating" hidden></div>
    <main>
        <section class="panel">
            <button type="button" class="icon-btn panel-lang" id="lang-toggle" aria-label="切换语言" title="切换语言"><span class="ms" aria-hidden="true">translate</span></button>
            <h1>创建你的角色</h1>
            <p>填写冒险者属性，准备开启旅程。</p>
            <form id="character-form">
                <label class="field"><span>角色昵称</span><input name="nickname" class="input" required maxlength="40" autocomplete="nickname" translate="no"></label>
                <fieldset class="character-section"><legend>身体属性</legend><div class="auth-grid">
                    <label class="field"><span>身高 cm</span><input name="height" class="input" type="number" min="100" max="250" step="0.1" required></label>
                    <label class="field"><span>体重 kg</span><input name="weight" class="input" type="number" min="20" max="400" step="0.1" required></label>
                    <label class="field"><span>年龄</span><input name="age" class="input" type="number" min="10" max="100" step="1" required></label>
                    <label class="field"><span>性别</span><select name="gender" class="input" required><option value="">请选择</option><option value="male">男</option><option value="female">女</option></select></label>
                    <label class="field"><span>目标体重 kg</span><input name="targetWeight" class="input" type="number" min="20" max="400" step="0.1"></label>
                </div></fieldset>
                <fieldset class="character-section"><legend>职业 · 日常活动量</legend><div class="class-grid" id="class-options"></div></fieldset>
                <label class="field"><span>药水补给 · 每日饮水 ml</span><input name="waterTarget" class="input" type="number" min="500" max="10000" step="50"><small>留空则按体重自动计算</small></label>
                <p id="draft-status" role="status">填写内容会自动保存，下次登录可继续。</p>
                <div class="auth-actions"><button type="submit" class="btn">开启冒险</button><button type="button" class="btn btn-ghost" id="leave-character">保存并退出</button></div>
            </form>
        </section>
        <section class="panel character-preview" aria-label="角色预览">
            <h2>冒险者档案</h2>
            <div class="avatar-stage" id="character-preview"></div>
            <p>外观随属性变化，开启你的专属冒险。</p>
        </section>
    </main>
    <script type="module" src="/js/character.js"></script>
</body>
</html>
